<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Variants - ' + ${product.slug})}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <p><a href="/admin/products">&larr; Back to Products</a></p>
    <div th:if="${#lists.isEmpty(variants)}" class="alert alert-warning">
        This product has no variants yet. Every product needs at least one &mdash; even a single
        fixed size/pack counts as its one variant.
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Variants for <span th:text="${product.slug}"></span></h1>
        <a th:href="@{'/admin/products/' + ${product.id} + '/variants/new'}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> New Variant
        </a>
    </div>
    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>Id</th>
            <th>Label</th>
            <th>Size</th>
            <th>Colour</th>
            <th>SKU</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Default</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="variant : ${variants}">
            <td th:text="${variant.id}"></td>
            <td th:text="${variant.variantLabel}"></td>
            <td th:text="${variant.size}"></td>
            <td th:text="${variant.colour}"></td>
            <td th:text="${variant.sku}"></td>
            <td th:text="${'₹' + variant.price}"></td>
            <td th:text="${variant.stockQuantity}"></td>
            <td>
                <span th:if="${variant.isDefault}" class="badge bg-primary">Default</span>
            </td>
            <td>
                <span th:if="${variant.isActive}" class="badge bg-success">Active</span>
                <span th:unless="${variant.isActive}" class="badge bg-secondary">Inactive</span>
            </td>
            <td class="text-end">
                <a th:href="@{'/admin/products/' + ${product.id} + '/variants/' + ${variant.id} + '/images'}"
                   class="btn btn-sm btn-outline-dark">Images</a>
                <a th:href="@{'/admin/products/' + ${product.id} + '/variants/' + ${variant.id} + '/edit'}"
                   class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{'/admin/products/' + ${product.id} + '/variants/' + ${variant.id} + '/delete'}"
                      method="post" class="d-inline" onsubmit="return confirm('Delete this variant?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(variants)}">
            <td colspan="10" class="text-center text-muted py-4">No variants yet.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
