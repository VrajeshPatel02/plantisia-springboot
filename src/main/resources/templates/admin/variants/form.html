<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head((${isEdit} ? 'Edit' : 'New') + ' Variant')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <p><a th:href="@{'/admin/products/' + ${product.id} + '/variants'}">&larr; Back to Variants</a></p>
    <h1 class="mb-4" th:text="(${isEdit} ? 'Edit' : 'New') + ' Variant for ' + ${product.slug}"></h1>

    <form th:action="@{${formAction}}" th:object="${variant}" method="post" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Variant Label</label>
            <input type="text" class="form-control" th:field="*{variantLabel}"
                   th:classappend="${#fields.hasErrors('variantLabel')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('variantLabel')}" th:errors="*{variantLabel}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Size</label>
            <input type="text" class="form-control" th:field="*{size}">
        </div>

        <div class="col-md-3">
            <label class="form-label">Colour</label>
            <input type="text" class="form-control" th:field="*{colour}">
        </div>

        <div class="col-md-3">
            <label class="form-label">SKU</label>
            <input type="text" class="form-control" th:field="*{sku}"
                   th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}"
                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Discounted Price</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{discountedPrice}"
                   th:classappend="${#fields.hasErrors('discountedPrice')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('discountedPrice')}" th:errors="*{discountedPrice}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Stock Quantity</label>
            <input type="number" min="0" class="form-control" th:field="*{stockQuantity}"
                   th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check me-3">
                <input class="form-check-input" type="checkbox" th:field="*{isDefault}">
                <label class="form-check-label">Default variant</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                <label class="form-check-label">Active</label>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{'/admin/products/' + ${product.id} + '/variants'}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
