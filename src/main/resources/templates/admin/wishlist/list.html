<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Wishlist')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <h1 class="mb-4">Wishlist</h1>

    <div th:if="${selectedUserId != null}" class="alert alert-info d-flex justify-content-between align-items-center">
        <span>Showing wishlist for user id <strong th:text="${selectedUserId}"></strong> only.</span>
        <a href="/admin/wishlist" class="btn btn-sm btn-outline-secondary">Clear filter</a>
    </div>

    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>Image</th>
            <th>User Id</th>
            <th>Product</th>
            <th>Added</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td>
                <img th:if="${item.primaryImageUrl}" th:src="${item.primaryImageUrl}" alt=""
                     style="height:40px;width:40px;object-fit:cover;border-radius:4px;">
                <span th:unless="${item.primaryImageUrl}" class="text-muted">&mdash;</span>
            </td>
            <td>
                <a th:href="@{/admin/wishlist(userId=${item.userId})}" th:text="${item.userId}"></a>
            </td>
            <td th:text="${item.productName != null ? item.productName : item.productSlug}"></td>
            <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd')}"></td>
            <td class="text-end">
                <form th:action="@{'/admin/wishlist/' + ${item.id} + '/delete'}" method="post" class="d-inline"
                      onsubmit="return confirm('Remove this wishlist item?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="5" class="text-center text-muted py-4">No wishlist items yet.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
