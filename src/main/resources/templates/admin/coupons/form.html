<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(${isEdit} ? 'Edit Coupon' : 'New Coupon')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <h1 class="mb-4" th:text="${isEdit} ? 'Edit Coupon' : 'New Coupon'"></h1>

    <form th:action="${isEdit} ? @{'/admin/coupons/' + ${couponId} + '/edit'} : @{/admin/coupons/create}"
          th:object="${couponForm}"
          method="post"
          class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Coupon Code</label>
            <input type="text" class="form-control text-uppercase" th:field="*{code}" placeholder="e.g. SUMMER2026"
                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : _" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Discount Type</label>
            <select class="form-select" th:field="*{discountType}"
                    th:classappend="${#fields.hasErrors('discountType')} ? 'is-invalid' : _" required>
                <option value="">-- Select Type --</option>
                <option th:each="type : ${discountTypes}" th:value="${type}" th:text="${type}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('discountType')}" th:errors="*{discountType}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Discount Value</label>
            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{discountValue}" placeholder="e.g. 10 or 150.00"
                   th:classappend="${#fields.hasErrors('discountValue')} ? 'is-invalid' : _" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Minimum Order Value (₹)</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{minOrderValue}" placeholder="0.00"
                   th:classappend="${#fields.hasErrors('minOrderValue')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('minOrderValue')}" th:errors="*{minOrderValue}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Max Usage Limit</label>
            <input type="number" min="1" class="form-control" th:field="*{maxUses}" placeholder="Leave blank for unlimited"
                   th:classappend="${#fields.hasErrors('maxUses')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('maxUses')}" th:errors="*{maxUses}"></div>
        </div>

        <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                <label class="form-check-label fw-semibold">Active</label>
            </div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Valid From</label>
            <input type="datetime-local" class="form-control" th:field="*{validFrom}"
                   th:classappend="${#fields.hasErrors('validFrom')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('validFrom')}" th:errors="*{validFrom}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Valid Until</label>
            <input type="datetime-local" class="form-control" th:field="*{validUntil}"
                   th:classappend="${#fields.hasErrors('validUntil')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('validUntil')}" th:errors="*{validUntil}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}" placeholder="Optional coupon details..."></textarea>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update' : 'Save'"></button>
            <a href="/admin/coupons" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
