<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Coupons')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Coupons</h1>
        <a href="/admin/coupons/create" class="btn btn-success"><i class="bi bi-plus-lg"></i> New Coupon</a>
    </div>

    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>Code</th>
            <th>Discount</th>
            <th>Min. Order</th>
            <th>Usage</th>
            <th>Valid Until</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="coupon : ${coupons}">
            <td>
                <span class="fw-bold text-uppercase" th:text="${coupon.code}"></span>
                <div class="small text-muted" th:text="${coupon.description}"></div>
            </td>
            <td th:text="${coupon.discountType.name() == 'PERCENTAGE' ? coupon.discountValue + '%' : '₹' + coupon.discountValue}"></td>
            <td th:text="${'₹' + coupon.minOrderValue}"></td>
            <td>
                <span th:text="${coupon.timesUsed}"></span>
                <span th:text="${coupon.maxUses != null ? ' / ' + coupon.maxUses : ' / ∞'}"></span>
            </td>
            <td th:text="${coupon.validUntil != null ? #temporals.format(coupon.validUntil, 'dd-MM-yyyy HH:mm') : 'No Expiry'}"></td>
            <td>
                <span th:if="${coupon.isActive}" class="badge bg-success">Active</span>
                <span th:unless="${coupon.isActive}" class="badge bg-secondary">Inactive</span>
            </td>
            <td class="text-end">
                <form th:action="@{'/admin/coupons/' + ${coupon.id} + '/toggle'}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-dark"
                            th:title="${coupon.isActive ? 'Deactivate' : 'Activate'}">
                        <i class="bi" th:classappend="${coupon.isActive ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                    </button>
                </form>
                <a th:href="@{'/admin/coupons/' + ${coupon.id} + '/edit'}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{'/admin/coupons/' + ${coupon.id} + '/delete'}" method="post" class="d-inline"
                      onsubmit="return confirm('Delete this coupon?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(coupons)}">
            <td colspan="7" class="text-center text-muted py-4">No coupons found.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPages > 1}" aria-label="Coupon pages">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active' : _">
                <a class="page-link" th:href="@{/admin/coupons(page=${i})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
