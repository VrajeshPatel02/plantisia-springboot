<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Reviews')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <h1 class="mb-4">Reviews</h1>
    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>Image</th>
            <th>Product</th>
            <th>Customer</th>
            <th>Rating</th>
            <th>Title / Comment</th>
            <th>Verified</th>
            <th>Posted</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="review : ${reviews}">
            <td>
                <img th:if="${review.reviewImageUrl}" th:src="${review.reviewImageUrl}" alt=""
                     style="height:40px;width:40px;object-fit:cover;border-radius:4px;">
                <span th:unless="${review.reviewImageUrl}" class="text-muted">&mdash;</span>
            </td>
            <td th:text="${review.productName != null ? review.productName : '-'}"></td>
            <td th:text="${review.userName}"></td>
            <td th:text="${review.rating} + ' / 5'"></td>
            <td>
                <strong th:if="${review.title}" th:text="${review.title}"></strong>
                <div class="text-muted small" th:if="${review.comment}"
                     th:text="${#strings.abbreviate(review.comment, 80)}"></div>
            </td>
            <td>
                <span th:if="${review.isVerifiedPurchase}" class="badge bg-success">Verified</span>
                <span th:unless="${review.isVerifiedPurchase}" class="badge bg-secondary">Unverified</span>
            </td>
            <td th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}"></td>
            <td class="text-end">
                <a th:href="@{'/admin/reviews/' + ${review.id} + '/edit'}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{'/admin/reviews/' + ${review.id} + '/delete'}" method="post" class="d-inline"
                      onsubmit="return confirm('Delete this review?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reviews)}">
            <td colspan="8" class="text-center text-muted py-4">No reviews yet.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
