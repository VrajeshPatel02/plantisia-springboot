<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Edit Review')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <p><a href="/admin/reviews">&larr; Back to Reviews</a></p>
    <h1 class="mb-4">Edit Review <small class="text-muted" th:text="'for ' + ${existing.productName}"></small></h1>
    <p class="text-muted">By <span th:text="${existing.userName}"></span></p>

    <div class="mb-4" th:if="${existing.reviewImageUrl}">
        <img th:src="${existing.reviewImageUrl}" alt="" style="height:120px;width:120px;object-fit:cover;border-radius:6px;">
        <form th:action="@{'/admin/reviews/' + ${reviewId} + '/remove-image'}" method="post" class="d-inline"
              onsubmit="return confirm('Remove this image from the review?');">
            <button type="submit" class="btn btn-sm btn-outline-danger ms-2">Remove Image</button>
        </form>
    </div>

    <form th:action="@{'/admin/reviews/' + ${reviewId}}" th:object="${review}" method="post" class="row g-3">

        <div class="col-md-3">
            <label class="form-label">Rating</label>
            <input type="number" min="1" max="5" class="form-control" th:field="*{rating}"
                   th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
        </div>

        <div class="col-md-9 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{isVerifiedPurchase}">
                <label class="form-check-label">Verified purchase</label>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Comment</label>
            <textarea class="form-control" rows="4" th:field="*{comment}"
                      th:classappend="${#fields.hasErrors('comment')} ? 'is-invalid' : _"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/reviews" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
