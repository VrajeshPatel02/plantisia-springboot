<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <h1 class="mb-4">Dashboard</h1>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title text-muted">Categories</h5>
                    <p class="display-6" th:text="${categoryCount}">0</p>
                    <a href="/admin/categories" class="btn btn-primary btn-sm">Manage Categories</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title text-muted">Products</h5>
                    <p class="display-6" th:text="${productCount}">0</p>
                    <a href="/admin/products" class="btn btn-primary btn-sm">Manage Products</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
