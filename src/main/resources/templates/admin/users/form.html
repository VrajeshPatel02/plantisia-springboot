<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Edit User')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <p><a href="/admin/users">&larr; Back to Users</a></p>
    <h1 class="mb-4">Edit User</h1>

    <form th:action="@{${formAction}}" th:object="${user}" method="post" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Role</label>
            <select class="form-select" th:field="*{role}">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
        </div>

        <div class="col-md-4 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                <label class="form-check-label">Active</label>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/users" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
