<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Order Details')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${'Order #' + order.id}"></h1>
        <a href="/admin/orders" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Orders</a>
    </div>

    <div class="row g-4">
        <!-- Order Items -->
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header bg-white fw-bold">Items</div>
                <div class="card-body p-0">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.productName}"></td>
                            <td th:text="${'₹' + item.price}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td class="text-end" th:text="${'₹' + (item.price * item.quantity)}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-white fw-bold">Summary</div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span th:text="${'₹' + order.subtotal}"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2 text-success" th:if="${order.discountAmount != null}">
                        <span>Discount:</span>
                        <span th:text="${'-₹' + order.discountAmount}"></span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total:</span>
                        <span th:text="${'₹' + order.totalAmount}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Management Sidebar -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header bg-white fw-bold">Customer Info</div>
                <div class="card-body">
                    <p class="mb-1 fw-bold" th:text="${order.customerName}"></p>
                    <p class="mb-1 text-muted" th:text="${order.customerEmail}"></p>
                    <p class="mb-0 text-muted" th:text="${order.customerPhone}"></p>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-white fw-bold">Update Status</div>
                <div class="card-body">
                    <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Order Status</label>
                            <select class="form-select" name="orderStatus">
                                <option th:each="status : ${orderStatuses}"
                                        th:value="${status}"
                                        th:text="${status}"
                                        th:selected="${status == order.orderStatus}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Update Status</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
