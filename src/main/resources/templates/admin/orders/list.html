<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Orders')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Orders</h1>
    </div>

    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Total Amount</th>
            <th>Payment Status</th>
            <th>Order Status</th>
            <th>Date</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders.content}">
            <td th:text="${'#' + order.id}"></td>
            <td th:text="${order.customerName}"></td>
            <td th:text="${'₹' + order.totalAmount}"></td>
            <td>
                <span class="badge"
                      th:classappend="${order.paymentStatus == 'PAID' ? 'bg-success' : (order.paymentStatus == 'PENDING' ? 'bg-warning text-dark' : 'bg-danger')}"
                      th:text="${order.paymentStatus}">
                </span>
            </td>
            <td>
                <span class="badge bg-info text-dark" th:text="${order.orderStatus}"></span>
            </td>
            <td th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
            <td class="text-end">
                <a th:href="@{'/admin/orders/' + ${order.id}}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-eye"></i> View
                </a>
            </td>
        </tr>
        <tr th:if="${orders.empty}">
            <td colspan="7" class="text-center text-muted py-4">No orders placed yet.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${orders.totalPages > 1}" aria-label="Order pages">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                th:classappend="${i == orders.number} ? 'active' : _">
                <a class="page-link" th:href="@{/admin/orders(page=${i})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
