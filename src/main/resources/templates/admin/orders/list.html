<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head('Orders')}"></head>

<body>

<nav th:replace="~{admin/fragments/nav :: nav}"></nav>

<div class="container">

    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Orders</h1>
    </div>


    <!-- Status Filter -->

    <form method="get"
          th:action="@{/admin/orders}"
          class="row g-2 mb-4">

        <div class="col-md-4">

            <select name="status"
                    class="form-select">

                <option value="">
                    All Statuses
                </option>

                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status}"
                        th:selected="${status == selectedStatus}">
                </option>

            </select>

        </div>


        <div class="col-auto">

            <button type="submit"
                    class="btn btn-primary">

                Filter

            </button>

        </div>


        <div class="col-auto">

            <a th:href="@{/admin/orders}"
               class="btn btn-outline-secondary">

                Reset

            </a>

        </div>

    </form>


    <!-- Orders Table -->

    <div class="table-responsive">

        <table class="table table-striped table-hover align-middle bg-white">

            <thead>

            <tr>

                <th>Order ID</th>

                <th>Order Number</th>

                <th>Customer</th>

                <th>Total Amount</th>

                <th>Payment Status</th>

                <th>Order Status</th>

                <th>Date</th>

                <th></th>

            </tr>

            </thead>


            <tbody>


            <!-- Orders -->

            <tr th:each="order : ${orders}">

                <td th:text="${'#' + order.id}">
                </td>


                <td th:text="${order.orderNumber}">
                </td>


                <td>

                    <div th:text="${order.customerName}">
                    </div>

                    <small class="text-muted"
                           th:text="${order.customerEmail}">
                    </small>

                </td>


                <td th:text="${'₹' + order.totalAmount}">
                </td>


                <!-- Payment Status -->

                <td>

                    <span class="badge"

                          th:classappend="${

                              order.paymentStatus.name() == 'PAID'

                              ? 'bg-success'

                              : (

                                  order.paymentStatus.name() == 'UNPAID'

                                  ? 'bg-secondary'

                                  : (

                                      order.paymentStatus.name() == 'FAILED'

                                      ? 'bg-danger'

                                      : 'bg-warning text-dark'

                                  )

                              )

                          }"

                          th:text="${order.paymentStatus}">
                    </span>

                </td>


                <!-- Order Status -->

                <td>

                    <span class="badge"

                          th:classappend="${

                              order.status.name() == 'PENDING'

                              ? 'bg-warning text-dark'

                              : (

                                  order.status.name() == 'PROCESSING'

                                  ? 'bg-primary'

                                  : (

                                      order.status.name() == 'SHIPPED'

                                      ? 'bg-info text-dark'

                                      : (

                                          order.status.name() == 'DELIVERED'

                                          ? 'bg-success'

                                          : 'bg-danger'

                                      )

                                  )

                              )

                          }"

                          th:text="${order.status}">
                    </span>

                </td>


                <!-- Date -->

                <td th:text="${#temporals.format(
                        order.createdAt,
                        'dd-MM-yyyy HH:mm'
                    )}">
                </td>


                <!-- Action -->

                <td class="text-end">

                    <a th:href="@{'/admin/orders/' + ${order.id}}"
                       class="btn btn-sm btn-outline-primary">

                        <i class="bi bi-eye"></i>

                        View

                    </a>

                </td>

            </tr>


            <!-- Empty State -->

            <tr th:if="${orders.empty}">

                <td colspan="8"
                    class="text-center text-muted py-4">

                    No orders placed yet.

                </td>

            </tr>


            </tbody>

        </table>

    </div>


    <!-- Pagination -->

    <nav th:if="${totalPages > 1}"
         aria-label="Order pages">

        <ul class="pagination">


            <!-- Previous -->

            <li class="page-item"
                th:classappend="${currentPage == 0 ? 'disabled' : ''}">

                <a class="page-link"

                   th:href="@{/admin/orders(
                        page=${currentPage - 1},
                        status=${selectedStatus}
                   )}">

                    Previous

                </a>

            </li>


            <!-- Page Numbers -->

            <li class="page-item"

                th:each="i : ${#numbers.sequence(
                    0,
                    totalPages - 1
                )}"

                th:classappend="${i == currentPage ? 'active' : ''}">

                <a class="page-link"

                   th:href="@{/admin/orders(
                        page=${i},
                        status=${selectedStatus}
                   )}"

                   th:text="${i + 1}">

                </a>

            </li>


            <!-- Next -->

            <li class="page-item"

                th:classappend="${

                    currentPage + 1 >= totalPages

                    ? 'disabled'

                    : ''

                }">

                <a class="page-link"

                   th:href="@{/admin/orders(
                        page=${currentPage + 1},
                        status=${selectedStatus}
                   )}">

                    Next

                </a>

            </li>


        </ul>

    </nav>


</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
