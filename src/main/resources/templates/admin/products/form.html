<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(${isEdit} ? 'Edit Product' : 'New Product')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <h1 class="mb-4" th:text="${isEdit} ? 'Edit Product' : 'New Product'"></h1>

    <form th:action="@{${formAction}}" th:object="${product}" method="post" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Slug</label>
            <input type="text" class="form-control" id="slug" th:field="*{slug}"
                   th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
            <div class="form-text">Auto-generated from the name &mdash; edit freely if needed.</div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Category</label>
            <select class="form-select" th:field="*{categoryId}"
                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : _">
                <option value="">-- Select a category --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Short Description</label>
            <input type="text" class="form-control" th:field="*{shortDescription}"
                   th:classappend="${#fields.hasErrors('shortDescription')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('shortDescription')}" th:errors="*{shortDescription}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
        </div>

        <div class="col-md-3">
            <label class="form-label">Base Price</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{basePrice}"
                   th:classappend="${#fields.hasErrors('basePrice')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Discounted Price</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{discountedPrice}"
                   th:classappend="${#fields.hasErrors('discountedPrice')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('discountedPrice')}" th:errors="*{discountedPrice}"></div>
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                <label class="form-check-label">Active</label>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/products" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
<script th:src="@{/js/slug-autofill.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
