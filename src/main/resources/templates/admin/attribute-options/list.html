<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Options - ' + ${attribute.name})}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <p><a href="/admin/attributes">&larr; Back to Attributes</a></p>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Options for <span th:text="${attribute.name}"></span></h1>
        <a th:href="@{'/admin/attributes/' + ${attribute.id} + '/options/new'}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> New Option
        </a>
    </div>
    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>Id</th>
            <th>Value</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="option : ${options}">
            <td th:text="${option.id}"></td>
            <td th:text="${option.value}"></td>
            <td class="text-end">
                <a th:href="@{'/admin/attributes/' + ${attribute.id} + '/options/' + ${option.id} + '/edit'}"
                   class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{'/admin/attributes/' + ${attribute.id} + '/options/' + ${option.id} + '/delete'}"
                      method="post" class="d-inline" onsubmit="return confirm('Delete this option?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(options)}">
            <td colspan="3" class="text-center text-muted py-4">No options yet.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
