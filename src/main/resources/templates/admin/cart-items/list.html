<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Cart Items')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <h1 class="mb-4">Cart Items</h1>

    <div th:if="${selectedUserId != null}" class="alert alert-info d-flex justify-content-between align-items-center">
        <span>Showing cart items for user id <strong th:text="${selectedUserId}"></strong> only.</span>
        <a href="/admin/cart-items" class="btn btn-sm btn-outline-secondary">Clear filter</a>
    </div>

    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>User Id</th>
            <th>Variant</th>
            <th>SKU</th>
            <th>Unit Price</th>
            <th>Qty</th>
            <th>Line Total</th>
            <th>Added</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td>
                <a th:href="@{/admin/cart-items(userId=${item.userId})}" th:text="${item.userId}"></a>
            </td>
            <td th:text="${item.variantLabel}"></td>
            <td th:text="${item.sku}"></td>
            <td th:text="${item.unitPrice != null ? '₹' + item.unitPrice : '-'}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.lineTotal != null ? '₹' + item.lineTotal : '-'}"></td>
            <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd')}"></td>
            <td class="text-end">
                <form th:action="@{'/admin/cart-items/' + ${item.id} + '/delete'}" method="post" class="d-inline"
                      onsubmit="return confirm('Remove this cart item?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="8" class="text-center text-muted py-4">No cart items yet.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
