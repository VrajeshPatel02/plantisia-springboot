<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(${isEdit} ? 'Edit Category' : 'New Category')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <h1 class="mb-4" th:text="${isEdit} ? 'Edit Category' : 'New Category'"></h1>

    <form th:action="@{${formAction}}" th:object="${category}" method="post" enctype="multipart/form-data" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Slug</label>
            <input type="text" class="form-control" th:field="*{slug}"
                   th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
            <div class="form-text">Lowercase words separated by hyphens, e.g. <code>fresh-vegetables</code>.</div>
        </div>

        <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : _"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Parent Category</label>
            <select class="form-select" th:field="*{parentId}">
                <option value="">-- None (top-level) --</option>
                <option th:each="parent : ${parentCategories}" th:value="${parent.id}" th:text="${parent.name}"></option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Sort Order</label>
            <input type="number" class="form-control" th:field="*{sortOrder}"
                   th:classappend="${#fields.hasErrors('sortOrder')} ? 'is-invalid' : _">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('sortOrder')}" th:errors="*{sortOrder}"></div>
        </div>

        <div class="col-md-4 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                <label class="form-check-label">Active</label>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label">Image</label>
            <input type="file" class="form-control" name="file" accept="image/jpeg,image/png,image/webp">
            <div th:if="${currentImageUrl}" class="mt-2">
                <img th:src="${currentImageUrl}" alt="Current image"
                     style="height:80px;width:80px;object-fit:cover;border-radius:6px;">
                <div class="form-text">Current image &mdash; choose a new file only if you want to replace it.</div>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/categories" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
<script th:src="@{/js/slug-autofill.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
