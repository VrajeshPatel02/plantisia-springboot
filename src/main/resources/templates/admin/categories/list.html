<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Categories')}"></head>
<body>
<nav th:replace="~{admin/fragments/nav :: nav}"></nav>
<div class="container">
    <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Categories</h1>
        <a href="/admin/categories/new" class="btn btn-success"><i class="bi bi-plus-lg"></i> New Category</a>
    </div>
    <table class="table table-striped table-hover align-middle bg-white">
        <thead>
        <tr>
            <th>Id</th>
            <th>Image</th>
            <th>Name</th>
            <th>Slug</th>
            <th>Parent</th>
            <th>Sort Order</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td>
                <img th:if="${category.imageUrl}" th:src="${category.imageUrl}" alt=""
                     style="height:40px;width:40px;object-fit:cover;border-radius:4px;">
                <span th:unless="${category.imageUrl}" class="text-muted">&mdash;</span>
            </td>
            <td th:text="${category.name}"></td>
            <td th:text="${category.slug}"></td>
            <td th:text="${category.parentName != null ? category.parentName : '-'}"></td>
            <td th:text="${category.sortOrder}"></td>
            <td>
                <span th:if="${category.isActive}" class="badge bg-success">Active</span>
                <span th:unless="${category.isActive}" class="badge bg-secondary">Inactive</span>
            </td>
            <td class="text-end">
                <a th:href="@{/admin/attributes(categoryId=${category.id})}" class="btn btn-sm btn-outline-dark">Attributes</a>
                <a th:href="@{'/admin/categories/' + ${category.id} + '/edit'}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{'/admin/categories/' + ${category.id} + '/delete'}" method="post" class="d-inline"
                      onsubmit="return confirm('Delete this category?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="8" class="text-center text-muted py-4">No categories yet.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
